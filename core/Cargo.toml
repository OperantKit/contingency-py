[package]
name = "contingency-core-py"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Builds the contingency_core extension module (the contingency-rs engine) as a Python wheel for contingency-py."

# Stand-alone crate: never part of an enclosing Cargo workspace.
[workspace]

[lib]
name = "contingency_core"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# The engine and its PyO3 module come from contingency-rs at a fixed commit
# (the schedule classes of contingency need its Schedule.state()).
# A path dependency is not allowed here: this repository must build on its own
# after a clone.
contingency = { git = "https://github.com/OperantKit/contingency-rs", rev = "fb077aae07add9b4e68eb7020fd7491f1dc174d0", default-features = false, features = ["python"] }
